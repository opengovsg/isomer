pull_request_rules:
  - name: Approve and merge non-major version dependabot upgrades
    conditions:
      - author~=^dependabot\[bot\]$
      - "check-success=✅ CI passed"
      - "#check-failure=0"
      - -dependabot-update-type = version-update:semver-major
      # PR author doesn't prove who wrote the code: anyone with write access can
      # push to a dependabot branch. Dependabot force-pushes a single commit, so
      # any extra commit disqualifies the PR from auto-merge.
      - "#commits=1"
      - "#commits-unverified=0"
      - commits[0].email_author = 49699333+dependabot[bot]@users.noreply.github.com
      - commits[0].email_committer = noreply@github.com
    actions:
      review:
        type: APPROVE
      merge:
        method: squash

  - name: Ping Isomer members for stale open PRs (>1 month since last activity)
    conditions:
      - updated-at<30 days ago
      - -closed
    actions:
      request_reviews:
        teams:
          - "@opengovsg/isomer-engineers"
      comment:
        message: This pull request has been stale for more than 30 days! Could someone please take a look at it @opengovsg/isomer-engineers


  - name: Automatically mark a PR as draft if [WIP] is in the title
    conditions:
      - title~=(?i)\[wip\]
    actions:
      edit:
        draft: true
