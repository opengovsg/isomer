name: CI

on:
  push:
    branches:
      - main
      - staging
      - production
  pull_request:
    types: [opened, synchronize]

env:
  LOG_LEVEL: silent

jobs:
  optimize_ci:
    runs-on: ubuntu-latest # or whichever runner you use for your CI
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - name: Optimize CI
        id: check_skip
        uses: withgraphite/graphite-ci-action@402a89bc8aa6db18ae1f9c61953d001d5f9d828f
        with:
          graphite_token: ${{ secrets.GRAPHITE_CI_OPTIMIZER_TOKEN }}
  # Detect which areas changed so dependent jobs can opt out when irrelevant.
  changes:
    runs-on: ubuntu-latest
    outputs:
      template_or_components: ${{ steps.filter.outputs.template_or_components }}
      studio_e2e_relevant: ${{ steps.filter.outputs.studio_e2e_relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            template_or_components:
              - 'packages/components/**'
              - 'tooling/template/**'
            # Anything the Studio app or its e2e run actually depend on at
            # runtime, plus the CI config that runs it — so a doc-only PR
            # skips e2e-tests, but editing this workflow still exercises it.
            studio_e2e_relevant:
              - 'apps/studio/**'
              - 'packages/components/**'
              - 'packages/db/**'
              - 'packages/algolia/**'
              - 'packages/pgboss/**'
              - 'packages/logging/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - parallel:
          - name: Lint
            run: pnpm run lint && pnpm run lint:ws
          - name: Lint Dockerfile
            uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
            with:
              dockerfile: "./apps/studio/Dockerfile"
              failure-threshold: "error"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Format
        run: pnpm run format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm run typecheck

  test-studio:
    name: Test Studio (${{ matrix.shard }}/${{ matrix.total_shards }})
    needs: optimize_ci
    runs-on: ubuntu-latest
    if: needs.optimize_ci.outputs.skip == 'false'
    strategy:
      fail-fast: false # so that we can run all shards and one shard can fail without failing the entire job
      matrix:
        shard: [1, 2] # extend this if we need to run more shards concurrently
        total_shards: [2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          job-index: ${{ matrix.shard }}
      - parallel:
          - name: Install Playwright (Chromium)
            # Required by the vitest "browser" project (Vitest Browser Mode).
            run: pnpm --filter isomer-studio exec playwright install chromium
          - name: Install dependencies
            # Not using test:unit dependency in Turbo because Datadog Test Visibility requires only the test suite to be run
            run: pnpm exec turbo run generate --filter=isomer-studio
          - name: Configure Datadog Test Visibility
            uses: datadog/test-visibility-github-action@d7e3562370d3742851764531da3cb54a743ebd63 # v3.1.0
            with:
              languages: js
              service: isomer-studio
              api_key: ${{ secrets.DD_API_KEY_GITHUB_ACTIONS }}
      - name: Test Studio
        # Loose env mode required for env vars to be passed to the run
        run: pnpm exec turbo test-ci:unit --filter=isomer-studio --env-mode=loose -- --shard=${{ matrix.shard }}/${{ matrix.total_shards }}
        env:
          # Required to allow Datadog to trace Vitest tests
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }} --import ${{ env.DD_TRACE_ESM_IMPORT }}
          # Set timezone to Singapore to ensure that the tests are run in the correct timezone
          TZ: Asia/Singapore

  test-components:
    name: Test Components
    needs: optimize_ci
    runs-on: ubuntu-latest
    if: needs.optimize_ci.outputs.skip == 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - parallel:
          - name: Install Playwright (Chromium)
            # Required by the vitest "browser" project (Vitest Browser Mode).
            run: pnpm --filter @opengovsg/isomer-components exec playwright install chromium
          - name: Configure Datadog Test Visibility
            uses: datadog/test-visibility-github-action@d7e3562370d3742851764531da3cb54a743ebd63 # v3.1.0
            with:
              languages: js
              service: isomer-studio
              api_key: ${{ secrets.DD_API_KEY_GITHUB_ACTIONS }}
      - name: Test Components
        run: pnpm exec turbo test-ci:unit --filter=@opengovsg/isomer-components --env-mode=loose
        env:
          # Required to allow Datadog to trace Vitest tests
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }} --import ${{ env.DD_TRACE_ESM_IMPORT }}
          # Set timezone to Singapore to ensure that the tests are run in the correct timezone
          TZ: Asia/Singapore

  test-template:
    name: Test Template (Bundle Pruning)
    needs: [optimize_ci, changes]
    runs-on: ubuntu-latest
    if: needs.optimize_ci.outputs.skip == 'false' && needs.changes.outputs.template_or_components == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Configure Datadog Test Visibility
        uses: datadog/test-visibility-github-action@d7e3562370d3742851764531da3cb54a743ebd63 # v3.1.0
        with:
          languages: js
          service: isomer-template
          api_key: ${{ secrets.DD_API_KEY_GITHUB_ACTIONS }}
      - name: Test template bundle pruning
        run: pnpm exec turbo test-ci:e2e --filter=isomer-base-template --env-mode=loose
        env:
          # Required to allow Datadog to trace Vitest tests
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }} --import ${{ env.DD_TRACE_ESM_IMPORT }}
          TZ: Asia/Singapore

  test-validators:
    name: Test Validators
    needs: optimize_ci
    runs-on: ubuntu-latest
    if: needs.optimize_ci.outputs.skip == 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Configure Datadog Test Visibility
        uses: datadog/test-visibility-github-action@d7e3562370d3742851764531da3cb54a743ebd63 # v3.1.0
        with:
          languages: js
          service: isomer-studio
          api_key: ${{ secrets.DD_API_KEY_GITHUB_ACTIONS }}
      - name: Test Validators
        run: pnpm exec turbo test-ci:unit --filter=@isomer/validators --env-mode=loose
        env:
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }} --import ${{ env.DD_TRACE_ESM_IMPORT }}
          TZ: Asia/Singapore

  test-pgboss:
    name: Test pgboss
    needs: optimize_ci
    runs-on: ubuntu-latest
    if: needs.optimize_ci.outputs.skip == 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - parallel:
          - name: Start test containers
            run: pnpm exec turbo run setup:test --filter=@isomer/pgboss
          - name: Configure Datadog Test Visibility
            uses: datadog/test-visibility-github-action@d7e3562370d3742851764531da3cb54a743ebd63 # v3.1.0
            with:
              languages: js
              service: isomer-pgboss
              api_key: ${{ secrets.DD_API_KEY_GITHUB_ACTIONS }}
      - name: Test pgboss
        run: pnpm exec turbo test-ci:unit --filter=@isomer/pgboss --env-mode=loose
        env:
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }} --import ${{ env.DD_TRACE_ESM_IMPORT }}
          TZ: Asia/Singapore

  publishing-script-tests:
    name: Publishing script tests
    needs: optimize_ci
    runs-on: ubuntu-latest
    if: needs.optimize_ci.outputs.skip == 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Configure Datadog Test Visibility
        uses: datadog/test-visibility-github-action@d7e3562370d3742851764531da3cb54a743ebd63 # v3.1.0
        with:
          languages: js
          service: isomer-publishing
          api_key: ${{ secrets.DD_API_KEY_GITHUB_ACTIONS }}
      - name: Test publishing script
        # Loose env mode required for env vars to be passed to the run
        run: pnpm exec turbo test-ci:unit --filter=publishing --env-mode=loose
        env:
          # Required to allow Datadog to trace Vitest tests
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }} --import ${{ env.DD_TRACE_ESM_IMPORT }}
          # Set timezone to Singapore to ensure that the tests are run in the correct timezone
          TZ: Asia/Singapore
      - name: Test full template build from publishing script output
        run: pnpm exec turbo test-ci:build --filter=publishing --env-mode=loose
        env:
          NODE_OPTIONS: -r ${{ env.DD_TRACE_PACKAGE }} --import ${{ env.DD_TRACE_ESM_IMPORT }}
          TZ: Asia/Singapore

  e2e-tests:
    name: E2E tests (${{ matrix.feature }})
    needs: [optimize_ci, changes]
    runs-on: ubuntu-latest
    if: needs.optimize_ci.outputs.skip == 'false' && needs.changes.outputs.studio_e2e_relevant == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false # so all shards run and one shard failing doesn't cancel the rest
      matrix:
        # One job per tests/e2e/<feature> directory, except smoke/singpass
        # (grouped as "root" since neither is role-tagged). `paths` are
        # passed straight to `playwright test <paths>`; role/project grep
        # filtering still applies on top. When you add a new
        # tests/e2e/<feature> directory, add an entry for it here — the
        # "declares every tests/e2e path" test in
        # apps/studio/scripts/e2eCiCoverage.test.ts fails if you forget.
        include:
          - feature: site
            paths: tests/e2e/site
          - feature: page-resource-collection
            paths: tests/e2e/page tests/e2e/resource tests/e2e/collection
          - feature: user
            paths: tests/e2e/user
          - feature: godmode
            paths: tests/e2e/godmode
          - feature: root
            paths: tests/e2e/smoke.test.ts tests/e2e/singpass.test.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Load .env file
        uses: opengovsg/dotenv@eff1dce037c4c0143cc4180a810511024c2560c0 # v2
        with:
          path: apps/studio
          mode: test
      - name: Next.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/apps/studio/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-
      - parallel:
          - name: Install Playwright (Chromium)
            run: pnpm --filter isomer-studio exec playwright install chromium
          - name: Build Studio app
            # Loose env mode required for env vars to be passed to the run
            run: pnpm exec turbo build --filter=isomer-studio --env-mode=loose
            env:
              # These source maps exist for Datadog RUM error tracking on real
              # deploys; e2e gets no benefit from them, and generating them is
              # a meaningful chunk of build time.
              SKIP_PRODUCTION_SOURCE_MAPS: "true"
              # This job's build is served via plain `next start`, never
              # `.next/standalone` — skip the dependency trace + copy that
              # `output: standalone` requires for Docker/start:standalone deploys.
              SKIP_STANDALONE_OUTPUT: "true"
          - name: Start test containers
            run: pnpm run setup:test
          - name: Configure Datadog Test Visibility
            uses: datadog/test-visibility-github-action@d7e3562370d3742851764531da3cb54a743ebd63 # v3.1.0
            with:
              languages: js
              service: isomer-studio
              api_key: ${{ secrets.DD_API_KEY_GITHUB_ACTIONS }}
      - name: Run Playwright tests
        run: pnpm exec turbo test-ci:e2e --filter=isomer-studio --env-mode=loose
        env:
          PLAYWRIGHT_TEST_PATHS: ${{ matrix.paths }}

      - name: Stop test containers
        run: pnpm run teardown

      - name: Upload test results
        if: ${{ !cancelled() }}
        id: upload-test-results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Unique per run+feature so that re-runs and parallel jobs don't collide.
          name: e2e-test-results-${{ github.run_id }}-${{ matrix.feature }}
          path: apps/studio/tests/e2e/test-results
          retention-days: 7
          if-no-files-found: warn

      # Posting a PR comment requires write access, but GitHub restricts
      # GITHUB_TOKEN to read-only for `pull_request` events from forks — no
      # `permissions:` declaration overrides this. The actual comment is posted
      # by post-pr-comment.yml, which uses a `workflow_run` trigger and runs in
      # the base-repo context where write access is available. We pass the PR
      # number and artifact URL through a small artifact because the two
      # workflows run in separate contexts and can't share environment variables.
      - name: Save E2E comment metadata
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.upload-test-results.outputs.artifact-url != '' }}
        run: |
          mkdir -p /tmp/e2e-metadata
          echo "${{ github.event.pull_request.number }}" > /tmp/e2e-metadata/pr-number.txt
          echo "${{ steps.upload-test-results.outputs.artifact-url }}" > "/tmp/e2e-metadata/artifact-url-${{ matrix.feature }}.txt"

      # Named per feature: with several jobs running in parallel, uploading a
      # single shared "e2e-comment-metadata" name from every matrix job would collide.
      - name: Upload E2E comment metadata
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.upload-test-results.outputs.artifact-url != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-comment-metadata-${{ matrix.feature }}
          path: /tmp/e2e-metadata/
          retention-days: 1
          if-no-files-found: error
