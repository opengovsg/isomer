name: bundle-size

# Named without whitespace so it's easy to grep/reference by exact string —
# post-bundle-size-comment.yml's `workflow_run.workflows` list must match
# this name exactly.
#
# Split out of ci.yml so that post-bundle-size-comment.yml (which only needs
# this job's artifact) can fire via `workflow_run` as soon as this job
# finishes, instead of waiting on ci.yml's slower jobs (e2e-tests,
# test-studio, etc). See post-bundle-size-comment.yml for why a
# `workflow_run` trigger is needed at all.
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  optimize_ci:
    runs-on: ubuntu-latest # or whichever runner you use for your CI
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - name: Optimize CI
        id: check_skip
        uses: withgraphite/graphite-ci-action@402a89bc8aa6db18ae1f9c61953d001d5f9d828f
        with:
          graphite_token: ${{ secrets.GRAPHITE_CI_OPTIMIZER_TOKEN }}

  # Skip the job when the diff cannot change first-load JS.
  changes:
    runs-on: ubuntu-latest
    outputs:
      firstload: ${{ steps.filter.outputs.firstload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            firstload:
              - 'packages/components/**'
              - 'apps/template/**'
              - '.github/workflows/bundle-size.yml'
              - '.github/workflows/post-bundle-size-comment.yml'
              - '.github/scripts/comment-template-bundle-size.sh'
              - '.github/scripts/first-load-to-env.mjs'

  components-bundle-size:
    name: Template first-load JS
    needs: [optimize_ci, changes]
    # Needs a `main` checkout to diff against. Informational: the job fails
    # when the build fails, not when a page's JS grew.
    if: needs.optimize_ci.outputs.skip == 'false' && needs.changes.outputs.firstload == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # The scorer and fixture have to survive the `main` checkout below.
      # Both measurements use this copy, so the pages and the byte counter
      # match. Each checkout still builds with its own `build:template`.
      - name: Stage scorer
        run: |
          mkdir -p "$RUNNER_TEMP/scorer/scripts" "$RUNNER_TEMP/scorer/benchmark"
          cp apps/template/scripts/first-load-js.mjs "$RUNNER_TEMP/scorer/scripts/"
          cp -a apps/template/benchmark/first-load "$RUNNER_TEMP/scorer/benchmark/"
          cp .github/scripts/first-load-to-env.mjs "$RUNNER_TEMP/scorer/"

      - name: Measure PR first-load JS
        run: |
          rm -rf packages/components/dist apps/template/out apps/template/.next
          pnpm --filter @opengovsg/isomer-components run build:module
          node apps/template/scripts/first-load-js.mjs > "$RUNNER_TEMP/pr.json"

      - name: Measure main first-load JS
        run: |
          git fetch --no-tags --depth=1 origin main
          git checkout --force FETCH_HEAD
          pnpm install --frozen-lockfile
          # pnpm exec may print install output first, so keep only the last line.
          template_dir=$(pnpm --filter isomer-base-template exec pwd | tail -n 1)
          mkdir -p "$template_dir/scripts" "$template_dir/benchmark"
          cp "$RUNNER_TEMP/scorer/scripts/first-load-js.mjs" "$template_dir/scripts/"
          rm -rf "$template_dir/benchmark/first-load"
          cp -a "$RUNNER_TEMP/scorer/benchmark/first-load" "$template_dir/benchmark/"
          rm -rf packages/components/dist "$template_dir/out" "$template_dir/.next"
          pnpm --filter @opengovsg/isomer-components run build:module
          node "$template_dir/scripts/first-load-js.mjs" > "$RUNNER_TEMP/base.json"

      # Integers only. post-bundle-size-comment.yml rejects anything else and
      # never runs a script from this artifact.
      - name: Save bundle size metadata
        run: |
          mkdir -p /tmp/bundle-size-metadata
          {
            echo "PR_NUMBER=${{ github.event.pull_request.number }}"
            node "$RUNNER_TEMP/scorer/first-load-to-env.mjs" "$RUNNER_TEMP/pr.json" PR
            node "$RUNNER_TEMP/scorer/first-load-to-env.mjs" "$RUNNER_TEMP/base.json" BASE
          } > /tmp/bundle-size-metadata/values.env

      - name: Upload bundle size metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-size-metadata
          path: /tmp/bundle-size-metadata/
          retention-days: 7
