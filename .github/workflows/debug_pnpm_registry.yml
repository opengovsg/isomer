name: Debug pnpm registry (throwaway)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Build installer stage with debug output
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: network=host

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build installer stage (expected to fail, we want the debug output)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        continue-on-error: true
        with:
          context: .
          file: "./apps/studio/Dockerfile"
          target: installer
          load: true
          tags: debug-installer:latest
