name: Install Playwright browsers
description: Restore cached Playwright browsers and install Chromium for a workspace package

inputs:
  filter:
    description: pnpm --filter target (e.g. isomer-studio or @opengovsg/isomer-components)
    required: true

runs:
  using: composite
  steps:
    # Get Playwright version to use for caching and installation
    # The 'filter' input targets a specific workspace/package.
    # This is mostly defensive in our monorepo (where Playwright version is usually consistent)
    # but allows flexibility if different packages ever require different versions or dev dependencies in the future.
    - name: Get Playwright version
      id: playwright-version
      shell: bash
      run: |
        version=$(pnpm --filter "${{ inputs.filter }}" exec playwright --version | awk '{print $2}')
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # Cache Playwright browsers to speed up future runs
    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

    # Install Playwright Chromium browser for the specified workspace
    - name: Install Playwright (Chromium)
      shell: bash
      run: pnpm --filter "${{ inputs.filter }}" exec playwright install chromium
